name: Notify Teams on Release Merge

on:
  push:
    branches:
      - releases

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Send notification to MS Teams
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          TITLE="📦🎉 New version of Compass-DS has been released! 🚀📦"
          TEXT="✨ **Version**: \`v${VERSION}\`\n\n🔍 [View commit](${{ github.event.head_commit.url }}) 🔗\n\n📥 *Install it:*\n@hstpathways/compass-ds@${VERSION}"

          echo "$TITLE"
          echo -e "$TEXT"
